<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>H3 Hex Parser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Banner Header -->
    <header class="banner-container">
        <img src="assets/H3-Hex-Parser.png" alt="Website Banner">
    </header>

  <main class="container">
    <h1>H3 Hex Parser</h1>
    <p>Easily parse and map in Uber's H3 grid, just upload a file</p>

    <!-- Upload -->
    <section>
      <label for="file-input">Upload CSV</label>
      <input type="file" id="file-input" accept=".csv">
    </section>

    <!-- Column selection -->
    <section id="column-selectors">
      <!-- renderColumnSelectors() fills this in once /upload responds -->
    </section>

    <!-- H3 resolution -->
    <section id="resolution-section" style="display:none;">
      <label for="resolution-input">H3 Resolution (0-15)
        <input type="number" id="resolution-input" min="0" max="15" value="7">
      </label>
    </section>

    <!-- Submit selections -->
    <section>
      <button id="process-btn" style="display:none;">Generate H3 Map</button>
    </section>

    <!-- Map output -->
    <section id="map-section">
      <iframe id="map-frame" style="width:100%; height:600px; border:none; display:none;"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
