<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H3 Hex Parser</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- Content goes here in later steps -->
     <header>
        <hgroup>
            <h1>H3 Hex Parser</h1>
            <p>Upload a file, get an H3 hex map. Aggregate your data onto Uber's H3 grid and download the results — no setup required.</p>
        </hgroup>
    </header>

    <form id="upload-form">
        <label for="file-input">
            Choose a file (CSV, Parquet, or GeoJSON)
            <input type="file" id="file-input" name="file" accept=".csv,.parquet,.geojson" required>
        </label>

        <div class="grid">
            <label for="agg-field">
            Field to aggregate
            <select id="agg-field" name="agg_field" disabled>
                <option value="">Upload a file first</option>
            </select>
            </label>

            <label for="hex-resolution">
            Hex size
            <select id="hex-resolution" name="hex_resolution">
                <option value="7">City (res 7)</option>
                <option value="9">Neighborhood (res 9)</option>
                <option value="11">Block (res 11)</option>
            </select>
            </label>
        </div>

        <button type="submit">Generate Map</button>
    </form>

    <section id="map-output" aria-live="polite">
  <!-- Map will be injected here after upload -->
    </section>


  </main>

  <script src="app.js"></script>
</body>
</html>
